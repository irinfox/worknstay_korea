  <!-- KTO searchKeyword2 coordinates (lng,lat), fit to this file's local xy via one shared
       affine calibration (least-squares over 8 already-placed metro-city polygons' own vertex
       centroids across all 6 regions in korea-regions.svg: Seoul/Incheon/Daejeon/Sejong/Busan/
       Daegu/Ulsan/Gwangju — not a per-region 2-point fit like Gangwon/Jeju used, since this map's
       coordinate frame is the *same* one those polygons already live in). Residuals ≤ ~18 units
       on a 250–900-unit-wide frame — illustrative, not survey-accurate (same caveat as Gangwon/
       Jeju). Seoul/Incheon landed a few units outside their own carved-out polygon on the raw fit
       (polygon-edge simplification noise, not a real gap) and were nudged inward to a ≥9-unit
       margin, same hand-nudge convention as Gangwon's ski pins.
       Seoul (Gwanghwamun-area tax-refund shop, representative of central Seoul) 126.9772,37.5705 ·
       Incheon (Incheon Chinatown) 126.6192,37.4739 · Suwon (Hwaseong Fortress) 127.0121,37.2873 ·
       Seongnam (2001 Outlet, Bundang — representative of the Bundang/Pangyo side of the city, no
       single obvious KTO-listed landmark for Seongnam itself) 127.1075,37.3491. -->

