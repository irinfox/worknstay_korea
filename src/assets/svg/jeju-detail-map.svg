<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 1045 400 190" class="region-detail-map__svg" role="img" aria-label="Map of Jeju-do showing Jeju-si and Seogwipo-si; Hallasan; Jeongbang Falls; and Jungmun Saekdal Beach and Woljeongri Beach">
  <!-- Province outline: src/assets/svg/korea-regions.svg#region-jeju, copied verbatim (same
       coordinate frame, no re-basing) and cropped to a generously padded viewBox — see below for
       why. Pins are hand-placed against this shape, not a lat/lng projection (CLAUDE.md map
       feedback log). Before moving a pin, re-run the point-in-polygon + margin check against
       these points AND a label/glyph bounding-box collision check (both scripted against a live
       render — see project memory) rather than eyeballing it; a pure point-in-polygon pass on
       these six pins still let two label pairs visibly overlap on screen the first time round.
       An island, so no neighbour-region orientation labels (unlike gangwon-detail-map.svg) —
       there's nothing adjacent to point at. -->
