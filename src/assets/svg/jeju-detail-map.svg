<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.6 1030 372 210" style="--region-map-zoom: calc(372 / 432)" class="region-detail-map__svg" role="img" aria-label="Map of Jeju-do showing Jeju-si and Seogwipo-si on the coast; Hallasan at the island's center; and Jungmun Saekdal Beach and Woljeongri Beach on the coast (beach names reveal on hover or tap)">
  <!-- Province outline: src/assets/svg/korea-regions.svg#region-jeju, same coordinate frame,
       scaled 2x about its own centroid for pin room. Island — no neighbour-region labels.
       viewBox x-origin shifted from -32 to -4.6 (width unchanged) so the island's content bbox
       (x 40.7–322.1) sits horizontally centered in the frame — the raw scale left ~73 units of
       margin on the left vs. ~18 on the right, which read as off-center on narrow/mobile
       viewports where the SVG box has no extra slack to absorb it. -->
  <polygon class="region-detail-map__shape" points="133.9,1087.8 145.5,1085.4 159.9,1075.8 172.3,1076.6 191.7,1073.2 197.1,1068.6 209.7,1069 213.7,1060.8 221.3,1066.2 225.5,1062.4 239.3,1061.6 244.7,1057.8 248.5,1060.6 253.9,1060.2 256.5,1056.6 263.1,1056.6 268.1,1060.8 278.7,1059.4 281.1,1067.4 290.3,1074 293.3,1072 305.9,1074 307.5,1077 304.9,1080 309.9,1081.6 309.5,1088.4 311.3,1090.8 306.7,1090.4 305.7,1093 309.9,1096.6 314.9,1096.2 314.9,1098 317.9,1096.2 322.1,1103.4 315.9,1102.6 312.9,1109.2 317.9,1115.4 315.1,1118 312.9,1113 310.9,1113.8 306.3,1126 307.1,1131.4 299.1,1134.4 293.3,1143 294.1,1146.8 286.1,1155.2 283.7,1163.6 278.1,1167.8 258.1,1170.2 256.9,1174 249.3,1179.4 245.5,1178.2 225.5,1184 216.7,1182.8 206.3,1190 203.7,1195 197.5,1197 189.5,1193.4 186.5,1197 183.7,1193.8 183.3,1197 169.5,1195 165.7,1199.2 158.9,1199.2 153.5,1203 144.7,1195 137.3,1198.4 127.3,1193.8 115.9,1199.6 112.1,1197.4 102.5,1197.4 100.5,1194.6 90.7,1201.6 87.9,1208 89.1,1212.2 77.9,1213.4 76.9,1207.2 74.9,1208.4 72.3,1206.2 63.3,1194.6 58.7,1193.8 49.3,1187 43.5,1176.2 40.7,1175 42.7,1169.4 40.7,1152.4 43.5,1149 46.5,1149 49.9,1142.2 55.7,1140.6 63.3,1130.2 69.9,1128.4 74.1,1120 76.5,1120 75.7,1121.4 77.5,1118.8 76.5,1117.2 76.1,1119.6 75.7,1116.8 77.1,1111 91.7,1105.8 95.3,1097.6 104.1,1098 121.7,1088.8 126.3,1091.2 133.5,1088.4" />

  <!-- KTO searchKeyword2 coordinates (lng,lat). Coastal fit: ray from the polygon's centroid
       along each place's real bearing, pin set an inset back from where it crosses the
       coastline (verified point-in-polygon + margin, not eyeballed). Hallasan is the one
       exception, centered rather than coastal-fit.
       Cities (representative landmark, not city hall): Jeju-si via Yongduam Rock
       126.5119710049,33.5158033889 · Seogwipo-si via Seogwipo Maeil Olle Market
       126.563223568437,33.2501482431274 — cast north/south of Hallasan rather than their
       literal bearing, to match the real map's look. Jeju-si's inset is deeper (17 vs ~11) so
       its glyph clears the coastline.
       Mountain: Hallasan 126.5813980571,33.2813248581, centered on the island rather than its
       real (south-trailhead) coordinate.
       Jeongbang Falls (126.5715923529,33.2450100844) has no pin — too close to Seogwipo-si at
       this scale.
       Beaches: Jungmun Saekdal Beach 126.4108385503,33.2498839643 · Woljeongri Beach
       126.7983896767,33.5546536829. Long names, so labels hide until hover/tap
       (.map-pin--beach) and reveal below the pin. Jungmun's label sits lower (y=22 vs. the
       usual 12) to clear Seogwipo-si's always-on label. Coastal clearance is checked from each
       glyph's near side to the coastline, not its anchor (top/surfboard for Woljeongri,
       bottom/wave for Jungmun) — ~4.3 unit margin each.

       Glyph/label sizing scaled by --region-map-zoom (372/432) to match Gangwon/Gyeongsang.
       Hit-target radii untouched — those are tap-target sizing, not visual scale. -->

  <g class="map-pin map-pin--city" data-poi-type="city" transform="translate(191.6,1086.8)">
    <svg class="map-pin__glyph" x="-6.46" y="-12.06" width="12.92" height="12.92" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5V6.2l4-2.7 4 2.7v7.3M10.5 13.5V8h3v5.5M1.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label map-pin__label--city" x="0" y="10.33" text-anchor="middle">Jeju-si</text>
  </g>
  <g class="map-pin map-pin--city" data-poi-type="city" transform="translate(185.4,1185.7)">
    <svg class="map-pin__glyph" x="-6.46" y="-12.06" width="12.92" height="12.92" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5V6.2l4-2.7 4 2.7v7.3M10.5 13.5V8h3v5.5M1.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label map-pin__label--city" x="0" y="10.33" text-anchor="middle">Seogwipo-si</text>
  </g>

  <g class="map-pin" data-poi-type="mountain" transform="translate(181.2,1133.9)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-6.89" y="-12.06" width="13.78" height="13.78" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12.5 6 4.5l2.6 4.6M6.6 12.5 10.5 5.5l4 7H1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="0" y="10.33" text-anchor="middle">Hallasan</text>
  </g>

  <g class="map-pin map-pin--beach" data-poi-type="surf_beach" tabindex="0" transform="translate(127,1189.5)">
    <circle class="map-pin__hit-target" r="18" />
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-6.89" y="-12.06" width="13.78" height="13.78" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.2 12.6c1.4-1.5 2.8-1.5 4.2 0 1.4 1.5 2.8 1.5 4.2 0 1.4-1.5 2.8-1.5 4.2 0" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.4 1.6c.6 3.4-1.2 6.4-4.9 8 .6-3.9 2.4-6.6 4.9-8Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="0" y="18.94" text-anchor="middle">Jungmun Saekdal Beach</text>
  </g>
  <g class="map-pin map-pin--beach" data-poi-type="surf_beach" tabindex="0" transform="translate(267,1079)">
    <circle class="map-pin__hit-target" r="18" />
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-6.89" y="-12.06" width="13.78" height="13.78" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.2 12.6c1.4-1.5 2.8-1.5 4.2 0 1.4 1.5 2.8 1.5 4.2 0 1.4-1.5 2.8-1.5 4.2 0" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.4 1.6c.6 3.4-1.2 6.4-4.9 8 .6-3.9 2.4-6.6 4.9-8Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="0" y="10.33" text-anchor="middle">Woljeongri Beach</text>
  </g>
</svg>
