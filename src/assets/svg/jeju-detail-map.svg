  <!-- KTO searchKeyword2 coordinates (mapX,mapY = longitude,latitude), live-verified. Jeju's
       polygon (140.7 x 78.4 in this coordinate frame) is much smaller than Gangwon's, but the
       .map-pin__label CSS rule (font-size: 10px) is shared across every region's detail map — a
       tight crop here would render that same 10px far too large relative to the island's own
       small footprint (and would leave no room for "Jungmun Saekdal Beach", the longest label).
       So this viewBox is deliberately padded well beyond the polygon's own bounding box, closer
       to Gangwon's px-per-unit ratio than to Gangwon's fill percentage — same reasoning the home
       page's Jeju infographic already uses for real geographic scale (CLAUDE.md feedback log:
       "Jeju keeps its true geographic distance... deliberate, don't fix the gap"), not a bug to
       tighten later.
       Cities (one representative in-town landmark each, not city hall, matching Gangwon's
       pattern): Jeju-si via "Yongduam Rock" 126.5119710049,33.5158033889 · Seogwipo-si via
       "Seogwipo Maeil Olle Market" 126.563223568437,33.2501482431274.
       Mountain: Hallasan (KTO's "Hallasan Mountain" listing) 126.5813980571,33.2813248581 — this
       resolves to a south-side trailhead (San 15-1 Topyeong-dong, Seogwipo-si), not the central
       crater, and sits close enough to both cities' own pins that no amount of nudging along that
       same north-south line left room for its label — the island is only ~78 units tall here vs.
       Gangwon's ~337. Pulled instead to the island's western interior, clear of the Jeju-si/
       Seogwipo-si/Jungmun cluster, with a side-mounted label (text beside the glyph, not below
       it) so it needs no vertical clearance from anyone — a hand-fit legibility placement, not a
       claim about Hallasan's true position (same liberty Gangwon's pin placements take).
       Waterfall: Jeongbang Falls ("Jeongbangpokpo Falls") 126.5715923529,33.2450100844 — genuinely
       ~1km from the Seogwipo-si pin above (both are literally that close in real life); given
       clearance room instead of plotted exactly on top of it, and label anchored to extend away
       from Seogwipo-si (text-anchor="start") rather than centred.
       Beaches: Jungmun Saekdal Beach 126.4108385503,33.2498839643 (label anchored
       text-anchor="end", extending away from the Seogwipo-si cluster to its east) · Woljeongri
       Beach 126.7983896767,33.5546536829 (label above the pin, not below — the default below
       placement collided with Jeju-si/Hallasan's territory south of it). -->

