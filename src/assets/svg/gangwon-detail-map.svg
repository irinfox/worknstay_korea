    <text class="map-pin__label map-pin__label--city" x="0" y="18" text-anchor="middle">Wonju</text>
  </g>

  <!-- Seoraksan: ~6.5km W / 4.4km S of Sokcho (128.5173,38.1671 vs Sokcho's coordinate above) —
       essentially Sokcho's back yard, placed close enough to read that way without touching. -->
  <g class="map-pin" transform="translate(483,136)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-14" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12.5 6 4.5l2.6 4.6M6.6 12.5 10.5 5.5l4 7H1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
