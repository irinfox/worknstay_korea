  <!-- Pulled in closer to the province outline (region-detail-map.css/CLAUDE.md map feedback) so
       the viewBox doesn't have to carry ~90 units of otherwise-empty margin just for these two
       orientation labels — they're markers, not to-scale placements, so nudging them east while
       keeping Seoul's y above Gyeonggi-do's preserves the real north-to-south relationship
       without needing the wide canvas. -->
  <text class="region-detail-map__neighbor" x="300" y="252" text-anchor="middle">Seoul</text>
  <text class="region-detail-map__neighbor" x="290" y="332" text-anchor="middle">Gyeonggi-do</text>
  <text class="region-detail-map__neighbor" x="486" y="-8" text-anchor="middle">North Korea</text>
  <text class="region-detail-map__neighbor" x="560" y="396" text-anchor="middle">Gyeongsang-do</text>

  <g class="map-pin map-pin--city" transform="translate(517,122)">
    <text class="map-pin__icon" aria-hidden="true" y="0">🏙️</text>
    <text class="map-pin__label map-pin__label--city" x="0" y="18" text-anchor="middle">Sokcho</text>
  </g>
  <g class="map-pin map-pin--city" transform="translate(592,222)">
    <text class="map-pin__icon" aria-hidden="true" y="0">🏙️</text>
    <text class="map-pin__label map-pin__label--city" x="14" y="4" text-anchor="start">Gangneung</text>
  </g>
  <g class="map-pin map-pin--city" transform="translate(392,188)">
    <text class="map-pin__icon" aria-hidden="true" y="0">🏙️</text>
    <text class="map-pin__label map-pin__label--city" x="0" y="18" text-anchor="middle">Chuncheon</text>
  </g>
  <g class="map-pin map-pin--city" transform="translate(416,298)">
    <text class="map-pin__icon" aria-hidden="true" y="0">🏙️</text>
    <text class="map-pin__label map-pin__label--city" x="0" y="18" text-anchor="middle">Wonju</text>
  </g>

  <g class="map-pin" transform="translate(452,108)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">🏔️</text>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle"><tspan x="0" dy="0">Seoraksan</tspan></text>
  </g>
  <!-- Surf beaches near Yangyang (Surfyy, Gisamun, Jukdo, Ingu) collapsed into one pin, labeled
       by place rather than as a separate Yangyang city pin — this stretch of coast IS Yangyang,
       so a second city pin right next to it was redundant clutter. Positioning is illustrative,
       not a precise centroid. -->
  <g class="map-pin map-pin--surf" transform="translate(561,189)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">🏄</text>
    <text class="map-pin__label" x="14" y="4" text-anchor="start">Yangyang beaches</text>
  </g>
  <!-- Ski resorts, plain pins (no links — visitkorea.or.kr guide is in "Useful links" below the
       map instead). Yongpyong + Alpensia are ~1.5km apart (genuinely one cluster, bundled under
       the Pyeongchang pin); Phoenix Park is a separate resort ~32km west of them (Bongpyeong-myeon
       vs Daegwallyeong-myeon). Not KTO-listed (no result under any English-name search): O2 Resort,
       Elysian Gangchon, and Oak Valley are positioned from their well-known addresses instead —
       lower confidence than the KTO-verified pins. Elysian Gangchon/Oak Valley are drawn as their
       own pins near Chuncheon/Wonju rather than bundled into the city pin, same treatment as every
       other resort here. Every pin below is verified to sit inside the province polygon with a real
       margin (scripted point-in-polygon + edge-distance check against the polygon points above) —
       several used to render right on top of the border or past it entirely; don't reposition by
       eye without re-running that check.

       map-pin--ski labels are hidden by default and revealed on hover/focus (region-detail-map.css)
       — 8 resort pins clustered this tightly stayed legible only by trading always-on labels for
       an on-demand reveal; tabindex="0" keeps that reachable without a mouse. -->
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(545,240)">
    <title>Yongpyong · Alpensia</title>
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">⛷️</text>
    <text class="map-pin__label" x="0" y="20" text-anchor="middle"><tspan x="0" dy="0">Pyeongchang</tspan><tspan x="0" dy="11" class="map-pin__note">Olympic 2018</tspan></text>
  </g>
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(455,258)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">⛷️</text>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle"><tspan x="0" dy="0">Phoenix Park</tspan></text>
  </g>
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(560,312)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">⛷️</text>
    <text class="map-pin__label" x="14" y="4" text-anchor="start"><tspan x="14" dy="0">High1</tspan></text>
  </g>
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(385,222)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">⛷️</text>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle"><tspan x="0" dy="0">Vivaldi Park</tspan></text>
  </g>
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(435,230)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">⛷️</text>
    <text class="map-pin__label" x="0" y="-14" text-anchor="middle"><tspan x="0" dy="0">Welli Hilli</tspan></text>
  </g>
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(602,329)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">⛷️</text>
    <text class="map-pin__label" x="14" y="4" text-anchor="start"><tspan x="14" dy="0">O2 Resort</tspan></text>
  </g>
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(426,183)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">⛷️</text>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle">Elysian Gangchon</text>
  </g>
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(445,288)">
    <text class="map-pin__icon" aria-hidden="true" y="0" style="font-size:18px">⛷️</text>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle">Oak Valley</text>
  </g>
</svg>
