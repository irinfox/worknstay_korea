  <text class="region-detail-map__neighbor" x="560" y="396" text-anchor="middle">Gyeongsang-do</text>

  <!-- KTO searchKeyword2 coordinates (mapX,mapY = longitude,latitude), live-verified — kept here
       so a pin adjustment doesn't need to re-query KTO for a place already looked up once.
       Cities: Sokcho 128.5865,38.2020 · Gangneung 128.8996,37.7645 · Chuncheon 127.7269,37.8793
       · Wonju 127.9276,37.3457 (one representative in-town landmark each, not city hall).
       Mountain: Seoraksan 128.5173,38.1671.
       Yangyang beaches, north to south: Surfyy 128.7175,38.0278 · Hajodae/proxy-for-Gisamun
       128.7243,38.0229 · Jukdo 128.7635,37.9717 · Ingu 128.7619,37.9703 (order per VisitKorea's
       Ingu Beach page: Jukdo/Ingu are ~150m apart, Jukdo to the north).
       Ski resorts: Yongpyong 128.6824,37.6458 · Alpensia 128.6744,37.6575 · Phoenix Park
       128.3205,37.5841 · High1 128.8395,37.2040 · Vivaldi Park 127.6874,37.6524 (Hongcheon-gun)
       · Welli Hilli 128.2493,37.4872 (Hoengseong-gun) · O2 Resort 128.9485,37.1703 (Taebaek-si)
       · Oak Valley 127.8159,37.4057 · Elysian Gangchon: no hit under any name tried, anchored
       instead to nearby "Gangchon Rail Park" 127.7121,37.8157. -->

  <g class="map-pin map-pin--city" transform="translate(517,122)">
    <svg class="map-pin__glyph" x="-7.5" y="-14" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5V6.2l4-2.7 4 2.7v7.3M10.5 13.5V8h3v5.5M1.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
