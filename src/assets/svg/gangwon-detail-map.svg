  </g>
  <!-- Yangyang beaches: one pin for the whole cluster (Surfyy/Hajodae-Gisamun/Jukdo/Ingu, coords
       above), centroid ~26km from Sokcho / ~30km from Gangneung — nearly equidistant, hence y=172
       sitting roughly midway between them. x=544 keeps the green wave glyph clear of the green
       province stroke (border crosses y=172 at x≈569.6) so it stays legible instead of merging
       into the outline. Detail line (beach names) reveals on hover/focus, like the ski pins. -->
  <g class="map-pin map-pin--surf" tabindex="0" transform="translate(544,172)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-14" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.2 12.6c1.4-1.5 2.8-1.5 4.2 0 1.4 1.5 2.8 1.5 4.2 0 1.4-1.5 2.8-1.5 4.2 0" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.4 1.6c.6 3.4-1.2 6.4-4.9 8 .6-3.9 2.4-6.6 4.9-8Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle">Yangyang beaches</text>
    <text class="map-pin__detail" x="0" y="30" text-anchor="middle">Surfyy · Gisamun · Jukdo · Ingu</text>
  </g>
  <!-- Ski resorts, plain pins (no links — visitkorea.or.kr guide is in "Useful links" below the
       map). Yongpyong + Alpensia are ~1.5km apart, bundled under one pin. Positions are hand-fit
       to this simplified polygon, not a projection — what matters is compass direction from the
       nearest city, verified per pin below. Labels hide by default, reveal on hover/focus
       (region-detail-map.css) — 8 resorts this close together stay legible only that way;
       tabindex="0" keeps the reveal reachable without a mouse. -->
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(548,258)">
    <title>Yongpyong · Alpensia</title>
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-13" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.4 9 10.4c.9.9 2.1 1.3 3.4 1.1M4.2 1.8l7.4 7c.9.9 2.1 1.3 3.4 1.1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="0" y="20" text-anchor="middle"><tspan x="0" dy="0">Yongpyong · Alpensia</tspan><tspan x="0" dy="11" class="map-pin__note">Olympic 2018</tspan></text>
  </g>
  <!-- Phoenix Park: 128.3205,37.5841 — ~62km SE of Chuncheon, ~44km NE of Wonju, ~32km W of
       Yongpyong/Alpensia. Placed closer to Wonju than Chuncheon to match that ratio. -->
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(475,222)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-13" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.4 9 10.4c.9.9 2.1 1.3 3.4 1.1M4.2 1.8l7.4 7c.9.9 2.1 1.3 3.4 1.1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
