  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(560,312)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-13" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.4 9 10.4c.9.9 2.1 1.3 3.4 1.1M4.2 1.8l7.4 7c.9.9 2.1 1.3 3.4 1.1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="14" y="4" text-anchor="start"><tspan x="14" dy="0">High1</tspan></text>
  </g>
  <!-- Vivaldi Park: 127.6874,37.6524 (Hongcheon-gun) — south of Chuncheon, northwest of Wonju. -->
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(410,235)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-13" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.4 9 10.4c.9.9 2.1 1.3 3.4 1.1M4.2 1.8l7.4 7c.9.9 2.1 1.3 3.4 1.1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle"><tspan x="0" dy="0">Vivaldi Park</tspan></text>
  </g>
  <!-- Welli Hilli: 128.2493,37.4872 (Hoengseong-gun, not Hongcheon — ~53km from Vivaldi Park,
       a different resort in a different county, not a neighbouring pair). -->
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(476,268)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-13" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.4 9 10.4c.9.9 2.1 1.3 3.4 1.1M4.2 1.8l7.4 7c.9.9 2.1 1.3 3.4 1.1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle"><tspan x="0" dy="0">Welli Hilli</tspan></text>
  </g>
  <!-- O2 Resort: 128.9485,37.1703, Taebaek-si (not Jeongseon) — ~10km ESE of High1. -->
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(602,329)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-13" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.4 9 10.4c.9.9 2.1 1.3 3.4 1.1M4.2 1.8l7.4 7c.9.9 2.1 1.3 3.4 1.1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="14" y="4" text-anchor="start"><tspan x="14" dy="0">O2 Resort</tspan></text>
  </g>
  <!-- Elysian Gangchon: no KTO hit under any name tried; anchored to "Gangchon Rail Park"
       127.7121,37.8157, ~1.6km W / ~7.1km S of Chuncheon. -->
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(386,220)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-13" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.4 9 10.4c.9.9 2.1 1.3 3.4 1.1M4.2 1.8l7.4 7c.9.9 2.1 1.3 3.4 1.1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
