  </g>
  <!-- Oak Valley: 127.8159,37.4057 — ~9km W / 7-10km N of Wonju (northwest, not northeast). -->
  <g class="map-pin map-pin--ski" tabindex="0" transform="translate(410,275)">
    <svg class="map-pin__glyph map-pin__glyph--nature" x="-8" y="-13" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.4 9 10.4c.9.9 2.1 1.3 3.4 1.1M4.2 1.8l7.4 7c.9.9 2.1 1.3 3.4 1.1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label" x="0" y="18" text-anchor="middle">Oak Valley</text>
