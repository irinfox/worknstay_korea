  <!-- KTO searchKeyword2 coordinates (lng,lat), same shared affine calibration as
       gyeonggi-detail-map.svg (see that file's comment for the fit methodology and its residual
       caveat). Daejeon (Daejeon O-World) 127.4001,36.2873 · Sejong (Sejong Lake Park)
       127.2702,36.4990 · Cheongju (Cheongju Early Printing Museum) 127.4715,36.6441 · Gongju
       (Gongsanseong Fortress) 127.1268,36.4629.
       Taean: no single KTO hit for "Taean" itself or for "Sinduri"/"Sinduri Coastal Sand Dune"
       under any keyword tried (same "no hit" situation as Gangwon's Elysian Gangchon) — pin is
       anchored to Mongsanpo Beach (126.2875,36.6701), the nearer of the two named features to a
       KTO-listed point, then nudged ~17 units for polygon margin. Sinduri (~19km up the coast)
       is named as a label under the pin rather than separately pinned, since it has no KTO
       coordinate of its own to place it by.

       Glyph/label sizing scaled by --region-map-zoom (546/432) to match Gangwon/Gyeongsang. -->

  <g class="map-pin map-pin--city" transform="translate(329.0,513.3)">
    <svg class="map-pin__glyph" x="-9.48" y="-17.69" width="18.96" height="18.96" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5V6.2l4-2.7 4 2.7v7.3M10.5 13.5V8h3v5.5M1.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label map-pin__label--city" x="0" y="15.17" text-anchor="middle">Daejeon</text>
  </g>
  <!-- Sejong/Gongju are only ~26 units apart here (genuinely close in real life, ~35km) — labels
       may overlap at small viewport widths; check by eye and offset one if so. -->
  <g class="map-pin map-pin--city" transform="translate(307.2,468.2)">
    <svg class="map-pin__glyph" x="-9.48" y="-17.69" width="18.96" height="18.96" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5V6.2l4-2.7 4 2.7v7.3M10.5 13.5V8h3v5.5M1.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label map-pin__label--city" x="0" y="15.17" text-anchor="middle">Sejong</text>
  </g>
  <g class="map-pin map-pin--city" transform="translate(343.2,437.1)">
    <svg class="map-pin__glyph" x="-9.48" y="-17.69" width="18.96" height="18.96" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5V6.2l4-2.7 4 2.7v7.3M10.5 13.5V8h3v5.5M1.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label map-pin__label--city" x="0" y="15.17" text-anchor="middle">Cheongju</text>
  </g>
  <g class="map-pin map-pin--city" transform="translate(281.9,475.9)">
    <svg class="map-pin__glyph" x="-9.48" y="-17.69" width="18.96" height="18.96" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5V6.2l4-2.7 4 2.7v7.3M10.5 13.5V8h3v5.5M1.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label map-pin__label--city" x="0" y="15.17" text-anchor="middle">Gongju</text>
  </g>
  <!-- Taean's two named features hide until hover/focus/tap, same mechanic as Gangwon's Yangyang
       beaches pin (map-pin--surf + map-pin__detail) — reused here for its behaviour, not because
       Taean is a surf spot. The "Taean" label itself stays always-on, like Yangyang's own label. -->
  <g class="map-pin map-pin--city map-pin--surf" tabindex="0" transform="translate(143.9,417.1)">
    <circle class="map-pin__hit-target" r="20" />
    <svg class="map-pin__glyph" x="-9.48" y="-17.69" width="18.96" height="18.96" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5V6.2l4-2.7 4 2.7v7.3M10.5 13.5V8h3v5.5M1.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text class="map-pin__label map-pin__label--city" x="0" y="15.17" text-anchor="middle">Taean</text>
    <text class="map-pin__detail" x="0" y="30.33" text-anchor="middle">Sinduri Coastal Sand Dune · Mongsanpo Mudflat</text>
  </g>
</svg>
